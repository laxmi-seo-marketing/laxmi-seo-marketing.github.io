<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travel Guides | Wanderwise Journal</title>

    <meta name="description"
        content="Practical travel guides covering budgeting, best time to visit, things to do and local tips to help you plan a better trip.">

    <meta name="robots" content="index, follow">

    <link rel="canonical"
        href="https://laxmi-seo-marketing.github.io/travel-guides/">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #222;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        header {
            border-bottom: 1px solid #e5e5e5;
            background: #ffffff;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .top-bar {
            max-width: 1200px;
            margin: auto;
            padding: 20px 25px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #123c52;
        }

        .tagline {
            color: #777;
            font-size: 14px;
        }

        nav {
            max-width: 1200px;
            margin: auto;
            padding: 0 25px 15px;
            display: flex;
            justify-content: center;
            gap: 32px;
            flex-wrap: wrap;
        }

        nav a {
            font-size: 15px;
            font-weight: 700;
            color: #333;
        }

        nav a.active,
        nav a:hover {
            color: #147d92;
        }

        .page-header {
            max-width: 1200px;
            margin: 35px auto 10px;
            padding: 0 25px;
        }

        .breadcrumb {
            font-size: 13px;
            color: #888;
            margin-bottom: 15px;
        }

        .breadcrumb a {
            color: #147d92;
            font-weight: 700;
        }

        .page-header h1 {
            font-size: 42px;
            color: #123c52;
            margin-bottom: 12px;
        }

        .page-header p {
            max-width: 700px;
            color: #555;
            font-size: 16px;
        }

        .filters {
            max-width: 1200px;
            margin: 25px auto 0;
            padding: 0 25px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filter-tag {
            border: 1px solid #d5dde0;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            color: #123c52;
        }

        .filter-tag.active {
            background: #123c52;
            color: #ffffff;
            border-color: #123c52;
        }

        .section {
            max-width: 1200px;
            margin: 45px auto;
            padding: 0 25px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .card {
            border: 1px solid #e5e5e5;
            border-radius: 14px;
            overflow: hidden;
            background: #fff;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .card-image {
            height: 200px;
            background-size: cover;
            background-position: center;
        }

        .img-3 { background-image: url("https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=900&q=80"); }
